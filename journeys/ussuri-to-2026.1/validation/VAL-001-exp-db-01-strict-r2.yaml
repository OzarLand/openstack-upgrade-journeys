# Validation record VAL-001. Template: docs/templates/validation-record.yaml. No value invented; "unknown" where unknown.
id: VAL-001
procedure: >-
  Offline database fast-forward of a Ussuri control plane's databases, without deploying any intermediate release.
  Path: Ussuri (online data migrations finished, computes fenced and forced-down through the API) ->
  2023.1 code for all services (db sync + online data migrations, Nova per cell) -> Cinder-only 2023.2 code (cinder 23.5.0,
  DR-004) -> gate PC-C1 -> 2024.1 -> 2025.1 -> 2026.1, then a second 2026.1 pass (idempotency).
  MariaDB stepwise 10.3 -> 10.5 -> 10.6 -> 10.11 -> 11.4 with mariadb-upgrade and a clean restart after each step.
classification_of_procedure: Technically possible but unsupported
status: LAB-VALIDATED
status_line: >-
  LAB-VALIDATED — scope: database schema and data migration Ussuri → 2026.1 by the S2c code sequence (with the Cinder
  23.5.0 step of DR-004), using upstream service code installed from PyPI under each release's upper-constraints,
  standalone MariaDB library images (no Galera), synthetic Tier A dataset generated through Ussuri APIs with the fake
  virt driver, no Kolla images, no Kolla-Ansible, no data plane.
openstack_version: "Ussuri (keystone 17.0.1, glance 20.2.0, placement 3.0.1, nova 21.2.4, neutron 16.4.2, cinder 16.4.2) to 2026.1; intermediate code 2023.1, cinder 23.5.0 (2023.2), 2024.1, 2025.1 (versions and pip freeze in evidence/EXP-DB-01/)"
kolla_ansible_version: "not used"
laboratory_topology: >-
  Single Docker host (Ubuntu 24.04 container, 4 vCPU, 15 GB RAM, no KVM). Container control plane built from PyPI;
  three fake computes (nova fake driver subclass), fake Neutron agents, fake Cinder driver; single standalone MariaDB;
  one-shot migration containers per release. Not Kolla. Described in DR-001 and assessments/05-lab-feasibility-and-baseline.md.
dataset: "Tier A baseline v4 (synthetic, ~4,100 rows, created through Ussuri APIs; derivation v1 -> v4 in experiments/EXP-DB-00-baseline.md)"
