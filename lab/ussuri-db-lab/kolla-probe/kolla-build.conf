# Probe: rebuild Kolla Ussuri images locally. Sources from GitHub git at the ussuri-eol tag instead of
# tarballs.opendev.org (blocked here). Not what the original ussuri images used (they used -stable-ussuri tarballs).
[DEFAULT]
base = ubuntu
base_tag = 18.04
install_type = source
namespace = ufj
tag = ussuri-probe
push = false
[openstack-base]
type = git
location = https://github.com/openstack/requirements
reference = ussuri-eol
